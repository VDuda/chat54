<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>chat54 — talk to the building</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0f1a; color: #e8ecf5; height: 100dvh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px 10px; border-bottom: 1px solid #1d2740;
    display: flex; align-items: baseline; gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header .sub { font-size: 12px; color: #8fa0c5; }
  #mood { margin-left: auto; font-size: 12px; color: #8fa0c5; }
  #login {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 24px; gap: 12px;
  }
  #login input, #bar input {
    background: #131b30; border: 1px solid #26355c; color: #e8ecf5;
    border-radius: 12px; padding: 14px; font-size: 16px; outline: none;
  }
  #login button, #bar button, #quick button {
    background: #2c60f0; border: 0; color: white; font-size: 16px;
    border-radius: 12px; padding: 14px 18px; font-weight: 600;
  }
  #login p { color: #8fa0c5; font-size: 13px; line-height: 1.5; margin: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.35; word-wrap: break-word; }
  .them { align-self: flex-start; background: #1a2340; border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: #2c60f0; border-bottom-right-radius: 4px; }
  .bld { align-self: flex-start; background: #172a1f; border: 1px solid #2f5c40; border-bottom-left-radius: 4px; }
  .who { display: block; font-size: 11px; opacity: .65; margin-bottom: 2px; }
  .act { display: block; font-size: 11px; color: #7fd8a5; margin-top: 3px; font-style: italic; }
  #quick { display: flex; gap: 8px; padding: 8px 12px 0; overflow-x: auto; }
  #quick button { background: #1a2340; color: #cdd8f0; font-size: 14px; padding: 9px 14px; white-space: nowrap; }
  #bar { display: flex; gap: 8px; padding: 10px 12px 14px; }
  #bar input { flex: 1; }
  #bar button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>chat54</h1><span class="sub">building 54 · 153 windows</span>
  <span id="mood">mood —</span>
</header>

<div id="login">
  <p>You're in a group chat with the MIT Green Building.<br>It replies in emoji — and in <b>light</b>. Look up.</p>
  <input id="name" placeholder="your name" autocomplete="off" maxlength="24">
  <button id="joinBtn">join the chat</button>
</div>

<div id="chat" hidden></div>
<div id="quick" hidden>
  <button data-t="hello!">👋 say hi</button>
  <button data-t="i love you">❤️ love</button>
  <button data-t="party!!">🎉 party</button>
  <button data-t="dance for me">💃 dance</button>
  <button data-t="tell me who you are">🏢 who are you</button>
  <button data-t="goodnight">🌙 goodnight</button>
</div>
<div id="bar" hidden>
  <input id="text" placeholder="say something to the building…" autocomplete="off" maxlength="280">
  <button id="sendBtn">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const moodEl = document.getElementById('mood');
let ws, name = 'anon';

function addMsg(user, text, cls, action) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<span class="who"></span>`;
  div.querySelector('.who').textContent = user;
  div.appendChild(document.createTextNode(text));
  if (action) {
    const a = document.createElement('span');
    a.className = 'act';
    a.textContent = '· the building ' + action;
    div.appendChild(a);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({type:'join', name}));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type !== 'msg') return;
    if (m.user === 'building54') {
      addMsg('building54', m.text, 'bld', m.label || '');
      if (typeof m.mood === 'number') {
        const v = Math.round(m.mood);
        moodEl.textContent = 'mood ' + (v > 0 ? '🔥'.repeat(Math.min(v,3)) : v < 0 ? '🌧️' : '😐');
      }
    } else if (m.user !== name) {
      addMsg(m.user, m.text, 'them');
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

function send(text) {
  if (!text || !ws || ws.readyState !== 1) return;
  addMsg(name, text, 'me');
  ws.send(JSON.stringify({type:'chat', text}));
}

document.getElementById('joinBtn').onclick = () => {
  name = (document.getElementById('name').value || 'anon').trim() || 'anon';
  for (const id of ['login']) document.getElementById(id).hidden = true;
  for (const id of ['chat','quick','bar']) document.getElementById(id).hidden = false;
  connect();
  document.getElementById('text').focus();
};
document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('joinBtn').click(); });
document.getElementById('sendBtn').onclick = () => { const i = document.getElementById('text'); send(i.value.trim()); i.value=''; };
document.getElementById('text').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const i = document.getElementById('text'); send(i.value.trim()); i.value=''; }
});
for (const b of document.querySelectorAll('#quick button'))
  b.onclick = () => send(b.dataset.t);
</script>
</body>
</html>
